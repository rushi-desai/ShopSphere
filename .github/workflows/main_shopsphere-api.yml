# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy

name: Build and deploy Node.js app to Azure Web App - shopsphere-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: shopsphere-api/package-lock.json

      - name: Verify Node and npm
        run: |
          node -v
          npm -v

      - name: Install dependencies
        working-directory: shopsphere-api
        run: npm ci

      - name: Generate Prisma Client
        working-directory: shopsphere-api
        run: npx prisma generate

      - name: Build application
        working-directory: shopsphere-api
        run: npm run build

      - name: Run tests
        working-directory: shopsphere-api
        run: npm run test --if-present

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: shopsphere-api

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./artifact

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CCD66B18B4264AAB8E1A9C9B05FBB09A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F3B3325F85F84E1182A4366C01AA5436 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2AE762DA506F4D6BADA437AAC03078A2 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'shopsphere-api-01'
          slot-name: 'Production'
          package: ./artifact
          startup-command: 'node dist/server.js'
